<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-Playable Robot • NFT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: #fff;
            font-family: 'Press Start 2P', system-ui;
            text-align: center;
            overflow-x: hidden;
        }
        .hero {
            height: 100vh;
            background: url('robots.png') center/cover no-repeat;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.72);
        }
        .logo {
            width: 240px;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 35px #00ff9d);
        }
        h1 {
            font-size: 4rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 30px #00ff9d;
            z-index: 2;
            line-height: 1.1;
        }
        .subtitle {
            font-size: 2.2rem;
            margin: 0 0 50px 0;
            opacity: 0.95;
            letter-spacing: 6px;
            z-index: 2;
        }
        .supply {
            font-size: 1.4rem;
            margin: 20px 0 60px 0;
            opacity: 0.9;
            z-index: 2;
        }
        .btn {
            display: inline-block;
            padding: 18px 50px;
            background: transparent;
            color: #00ff9d;
            border: 3px solid #00ff9d;
            text-decoration: none;
            font-size: 1.25rem;
            margin: 15px;
            transition: all 0.3s;
            z-index: 2;
        }
        .btn:hover {
            background: #00ff9d;
            color: #000;
            box-shadow: 0 0 40px #00ff9d;
        }
        .section {
            padding: 100px 20px;
        }
        footer {
            padding: 60px 20px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="hero">
        <img src="image (1).jpg" alt="Non-Playable Robot Logo" class="logo">
        <h1>NON-PLAYABLE<br>ROBOT</h1>
        <p class="subtitle">NpRobot</p>
        <p class="supply">10,000 UNIQUE ROBOTS ON-CHAIN</p>
        
        <div>
            <a href="https://x.com/NPRoboteth" class="btn" target="_blank">FOLLOW @NPROBOTETH</a>
        </div>
    </div>

    <div class="section">
        <h2 style="font-size: 2.8rem; margin-bottom: 40px;">LOOK AT THEM.<br>THEY'RE RIGHT HERE.</h2>
        <p style="max-width: 700px; margin: 0 auto 60px; font-size: 1.35rem; line-height: 1.6;">
            A generative NFT collection of Non-Playable Robots living on the blockchain.
        </p>
        <img src="robots.png" alt="Non-Playable Robot Collection" style="max-width: 100%; border: 4px solid #00ff9d; image-rendering: pixelated;">
    </div>

    <footer>
        © 2026 Non-Playable Robot • <a href="https://x.com/NPRoboteth" style="color:#00ff9d;">@NPRoboteth</a><br>
        nprobot.xyz
    </footer>
</body>
</html>
