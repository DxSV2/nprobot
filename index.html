<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-Playable Robot • NFT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: #fff;
            font-family: 'Press Start 2P', system-ui;
            text-align: center;
            overflow-x: hidden;
        }
        .header {
            padding: 35px 15px 20px;
        }
        h1 {
            font-size: 2.1rem;
            line-height: 1.15;
            margin: 0 0 30px 0;
            color: #ffffff;
        }
        .logo {
            width: 150px;
            margin: 0 auto 30px;
            display: block;
        }
        .main-box {
            background: #111;
            border: 3px solid #ffffff;
            padding: 25px 15px;
            max-width: 440px;
            margin: 0 auto 40px;
        }
        .title {
            font-size: 1.5rem;
            margin: 0 0 25px 0;
            color: #fff;
        }
        .collection {
            width: 100%;
            max-height: 420px;
            image-rendering: pixelated;
            border: 3px solid #444;
            background: #000;
            animation: zoomPulse 12s infinite ease-in-out;
        }
        @keyframes zoomPulse {
            0%   { transform: scale(1.0); }
            50%  { transform: scale(1.04); }
            100% { transform: scale(1.0); }
        }
        .supply {
            font-size: 1.2rem;
            margin: 30px 0 50px;
            letter-spacing: 3px;
        }
        footer {
            padding: 30px 20px 60px;
            font-size: 0.85rem;
            opacity: 0.8;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>LOOK AT THEM.<br>They're right here.</h1>
        
        <img src="image (1).jpg" alt="Logo" class="logo">
    </div>

    <div class="main-box">
        <div class="title">Non-Playable Robot</div>
        <img src="fbe51d79-1593-4059-ac92-7658fb193fdf.png" alt="Robot Collection" class="collection">
    </div>

    <p class="supply">TOTAL SUPPLY <strong>10,000</strong></p>

    <footer>
        © 2026 Non-Playable Robot <br>
        <a href="https://x.com/NPRoboteth" style="color:#fff;">@NPRoboteth</a>
    </footer>
</body>
</html>
