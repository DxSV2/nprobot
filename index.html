<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-Playable Robot • NFT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: #fff;
            font-family: 'Press Start 2P', system-ui;
            text-align: center;
            overflow-x: hidden;
        }
        .hero {
            min-height: 100vh;
            background: url('robots.png') center/cover no-repeat;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
        }
        .logo {
            width: 180px;
            max-width: 80%;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 25px #00ff9d);
        }
        h1 {
            font-size: 2.8rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 25px #00ff9d;
            z-index: 2;
            line-height: 1.1;
        }
        .subtitle {
            font-size: 1.6rem;
            margin: 0 0 30px 0;
            opacity: 0.95;
            letter-spacing: 4px;
            z-index: 2;
        }
        .supply {
            font-size: 1.1rem;
            margin: 15px 0 40px 0;
            opacity: 0.9;
            z-index: 2;
        }
        .btn {
            display: inline-block;
            padding: 15px 35px;
            background: transparent;
            color: #00ff9d;
            border: 3px solid #00ff9d;
            text-decoration: none;
            font-size: 1.1rem;
            margin: 10px;
            transition: all 0.3s;
            z-index: 2;
        }
        .btn:hover {
            background: #00ff9d;
            color: #000;
            box-shadow: 0 0 30px #00ff9d;
        }
        .section {
            padding: 80px 20px;
        }
        .section img {
            max-width: 100%;
            border: 4px solid #00ff9d;
            image-rendering: pixelated;
        }
        footer {
            padding: 50px 20px;
            font-size: 0.85rem;
            opacity: 0.7;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            h1 { font-size: 2.4rem; }
            .subtitle { font-size: 1.4rem; }
            .logo { width: 140px; }
        }
        @media (max-width: 480px) {
            h1 { font-size: 2.1rem; }
            .subtitle { font-size: 1.2rem; letter-spacing: 2px; }
            .btn { padding: 14px 30px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="hero">
        <img src="image (1).jpg" alt="Non-Playable Robot Logo" class="logo">
        <h1>NON-PLAYABLE<br>ROBOT</h1>
        <p class="subtitle">NpRobot</p>
        <p class="supply">10,000 UNIQUE ROBOTS ON-CHAIN</p>
        
        <div>
            <a href="https://x.com/NPRoboteth" class="btn" target="_blank">FOLLOW @NPROBOTETH</a>
        </div>
    </div>

    <div class="section">
        <h2 style="font-size: 2.2rem; margin-bottom: 30px;">LOOK AT THEM.<br>THEY'RE RIGHT HERE.</h2>
        <p style="max-width: 700px; margin: 0 auto 50px; font-size: 1.1rem; line-height: 1.6;">
            A generative NFT collection of Non-Playable Robots living on the blockchain.
        </p>
        <img src="robots.png" alt="Non-Playable Robot Collection">
    </div>

    <footer>
        © 2026 Non-Playable Robot • <a href="https://x.com/NPRoboteth" style="color:#00ff9d;">@NPRoboteth</a><br>
        nprobot.xyz
    </footer>
</body>
</html>
