<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-Playable Robot • NFT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: #fff;
            font-family: 'Press Start 2P', system-ui;
            text-align: center;
            overflow-x: hidden;
        }
        .header {
            padding: 30px 15px 15px;
        }
        h1 {
            font-size: 1.8rem;
            line-height: 1.2;
            margin: 0 0 20px 0;
        }
        .logo {
            max-width: 180px;
            width: 100%;
            height: auto;
            margin: 15px auto 25px;
            display: block;
            image-rendering: pixelated;
        }
        .main-box {
            background: #111;
            border: 3px solid #ffffff;
            padding: 20px 15px;
            max-width: 440px;
            margin: 0 auto 30px;
        }
        .collection {
            width: 100%;
            max-height: 420px;
            image-rendering: pixelated;
            border: 3px solid #444;
            background: #000;
            animation: robotGlitch 8s infinite linear;
        }
        @keyframes robotGlitch {
            0%, 100% { transform: scale(1.0); }
            2%   { transform: scale(1.02) rotate(0.8deg); }
            4%   { transform: scale(1.0) rotate(-0.6deg); }
        }

        .supply { font-size: 1.2rem; margin: 25px 0 35px; letter-spacing: 2px; }
        .description {
            max-width: 420px;
            margin: 0 auto 40px;
            padding: 0 20px;
            font-size: 0.95rem;
            line-height: 1.6;
            opacity: 0.9;
        }
        .btn {
            display: inline-block;
            margin: 25px auto 35px;
            padding: 15px 35px;
            background: #000;
            color: #fff;
            border: 3px solid #fff;
            font-family: 'Press Start 2P', system-ui;
            font-size: 1rem;
            text-decoration: none;
        }
        .btn:hover {
            background: #fff;
            color: #000;
        }
        .social-icon {
            width: 58px;
            height: 58px;
            background: #ffffff;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 12px;
            padding: 8px;
        }
        .social-icon img {
            width: 34px;
            height: 34px;
            object-fit: contain;
        }
        footer {
            padding: 25px 10px;
            font-size: 0.85rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>LOOK AT THEM.<br>They're right here.</h1>
        <img src="logo.png" alt="Non-Playable Robot Logo" class="logo"
             onerror="this.src='https://via.placeholder.com/180x180/111/fff?text=NPR';">
    </div>

    <div class="main-box">
        <div class="title">Non-Playable Robot</div>
        <img src="robot-collection.png" alt="Robot Collection" class="collection"
             onerror="this.src='https://via.placeholder.com/400x400/000/fff?text=ROBOT';">
    </div>

    <p class="supply">TOTAL SUPPLY <strong>10,000</strong></p>

    <p class="description">
        A generative NFT collection of 10,000 unique Non-Playable Robots living on the Ethereum Blockchain. 
        Each robot is one-of-a-kind with different traits, ready to join the digital world.
    </p>

    <a href="roadmap.html" class="btn">VIEW ROADMAP</a>

    <!-- Social Links -->
    <div class="social-links" style="margin: 30px 0 40px;">
        <a href="https://x.com/NPRoboteth" target="_blank" class="social-icon">
            <img src="x.jpg" alt="X" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/5/5e/X_logo_2023.svg';">
        </a>
        <a href="https://opensea.io/collection/non-playable-robot" target="_blank" class="social-icon">
            <img src="images.png" alt="OpenSea" onerror="this.src='https://storage.googleapis.com/opensea-static/Logos/opensea-logomark-blue.svg';">
        </a>
    </div>

    <footer>
        © 2026 Non-Playable Robot
    </footer>
</body>
</html>
