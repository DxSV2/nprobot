<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-Playable Robot • NFT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: #fff;
            font-family: 'Press Start 2P', system-ui;
            text-align: center;
            overflow-x: hidden;
        }
        .header {
            padding: 20px;
            background: rgba(0,0,0,0.9);
            border-bottom: 3px solid #00ff9d;
        }
        .hero {
            padding: 30px 20px;
            background: #111;
        }
        .character-box {
            background: #1a1a1a;
            padding: 20px;
            border: 4px solid #00ff9d;
            max-width: 420px;
            margin: 0 auto 30px;
            box-shadow: 0 0 30px #00ff9d;
        }
        .character {
            width: 100%;
            max-height: 420px;
            image-rendering: pixelated;
            background: #000;
        }
        h1 {
            font-size: 1.8rem;
            margin: 15px 0 5px;
            text-shadow: 0 0 15px #00ff9d;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #00ff9d;
            margin-bottom: 20px;
        }
        .supply {
            font-size: 1rem;
            margin: 20px 0;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 30px 0;
        }
        .btn {
            padding: 14px 24px;
            background: transparent;
            color: #00ff9d;
            border: 3px solid #00ff9d;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #00ff9d;
            color: #000;
        }
        footer {
            padding: 40px 20px;
            font-size: 0.8rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>LOOK AT THEM.<br>They're right here.</h1>
    </div>

    <div class="hero">
        <div class="character-box">
            <img src="robots.png" alt="Non-Playable Robot" class="character">
        </div>

        <p class="supply">TOTAL SUPPLY <strong>10,000</strong></p>

        <div class="controls">
            <button class="btn" onclick="alert('Coming soon - Random Robot')">←</button>
            <button class="btn" onclick="alert('Coming soon - Random Robot')">🎲 RANDOM</button>
            <button class="btn" onclick="alert('Download feature coming soon')">↓ DOWNLOAD</button>
            <button class="btn" onclick="alert('Coming soon - Random Robot')">→</button>
        </div>
    </div>

    <footer>
        © 2026 Non-Playable Robot • nprobot.xyz<br>
        <a href="https://x.com/NPRoboteth" style="color:#00ff9d;">@NPRoboteth</a>
    </footer>
</body>
</html>
