<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-Playable Robot • NFT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: #fff;
            font-family: 'Press Start 2P', system-ui;
            text-align: center;
            overflow-x: hidden;
        }
        .header {
            padding: 25px 15px 15px;
        }
        h1 {
            font-size: 2.1rem;
            line-height: 1.1;
            margin: 0 0 20px 0;
            text-shadow: 0 0 20px #00ffff;
        }
        .main-box {
            background: #111;
            border: 3px solid #00ffff;
            padding: 20px;
            max-width: 420px;
            margin: 0 auto 30px;
        }
        .logo {
            width: 70px;
            margin-bottom: 15px;
        }
        .title {
            font-size: 1.35rem;
            margin: 10px 0;
            color: #fff;
        }
        .supply {
            font-size: 1.1rem;
            margin: 25px 0;
            letter-spacing: 2px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 30px 0;
        }
        .btn {
            padding: 16px 20px;
            background: transparent;
            color: #00ffff;
            border: 3px solid #00ffff;
            font-size: 0.95rem;
            min-width: 110px;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #00ffff;
            color: #000;
        }
        .character {
            width: 100%;
            max-height: 380px;
            image-rendering: pixelated;
            background: #000;
            border: 2px solid #222;
        }
        footer {
            padding: 40px 20px 60px;
            font-size: 0.8rem;
            opacity: 0.75;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>LOOK AT THEM.<br>They're right here.</h1>
    </div>

    <div class="main-box">
        <img src="image (1).jpg" alt="Logo" class="logo">
        <div class="title">Non-Playable Robot</div>
        
        <img src="robots.png" alt="Robot Collection" class="character">

        <p class="supply">TOTAL SUPPLY <strong>10,000</strong></p>

        <div class="controls">
            <button class="btn">←</button>
            <button class="btn">🎲 RANDOM</button>
            <button class="btn">↓ DOWNLOAD</button>
            <button class="btn">→</button>
        </div>
    </div>

    <footer>
        © 2026 Non-Playable Robot • nprobot.xyz<br>
        <a href="https://x.com/NPRoboteth" style="color:#00ffff;">@NPRoboteth</a>
    </footer>
</body>
</html>
